<div id="mf-tabs">
  <span class="mf-heading">FINANCE HUB</span>
  <button type="button" data-section="dashboard">Dashboard</button>
  <button type="button" data-section="suppliers">Suppliers</button>

<section id="mf-panel">

  <p id="mf-panel-description"></p>
  <iframe id="mf-panel-frame" title="Finance management"></iframe>
</section>

<script id="mf-navigation-controller">
(function() {
  const labels = {
    suppliers: [
      "Supplier Management",
      "Manage vendors, payment terms and expense categories."
    ],
    automation: [
      "Approval Rules",
      "Configure invoice validation and approval limits."
    ],
    accounting: [
      "General Ledger",
      "Review approved invoice journal entries and export CSV."
    ]
  };

  const tabs = document.getElementById("mf-tabs");
  const panel = document.getElementById("mf-panel");
  const frame = document.getElementById("mf-panel-frame");

  const hidden = new Map();

  function showOriginal() {
    hidden.forEach(function(display, element) {
      element.style.display = display;
    });
    hidden.clear();
  }

  function hideOriginal() {
    const selectors = [
      "#main",
      "#app",
      "main",
      "#nav"
    ];

    selectors.forEach(function(selector) {
      const element = document.querySelector(selector);

      if (!element) return;
      if (element === panel) return;
      if (panel.contains(element)) return;
      if (tabs.contains(element)) return;
      if (hidden.has(element)) return;

      hidden.set(element, element.style.display);
      element.style.display = "none";
    });
  }

  function switchTo(section) {
    tabs.querySelectorAll("button").forEach(function(button) {
      button.classList.toggle(
        "selected",
        button.dataset.section === section
      );
    });

    if (section === "dashboard") {
      panel.style.display = "none";
      showOriginal();
      return;
    }

    if (!labels[section]) return;

    showOriginal();
    hideOriginal();

    document.getElementById("mf-panel-title").textContent =
      labels[section][0];

    document.getElementById("mf-panel-description").textContent =
      labels[section][1];

    panel.style.display = "block";

    const url =
      "/finance-operations?embedded=1&section=" +
      encodeURIComponent(section);

    if (frame.getAttribute("src") !== url) {
      frame.setAttribute("src", url);
    }

    window.scrollTo(0, 0);
  }

  tabs.addEventListener("click", function(event) {
    const button = event.target.closest("button[data-section]");
    if (!button) return;
    switchTo(button.dataset.section);
  });

  switchTo("dashboard");
})();
</script>

<script>
const NAV=[
  "Overview","Invoices","AI Processing","Approvals",
  "Automation","Suppliers","Accounting",
  "Analytics","AI Benchmark","Audit Logs"
];

let page="Overview";
let invoices=[],logs=[],bench=[],config={};
let selected=null;
let search="";
let filter="All";
let invoiceTab="All";
let approvalTab="Pending";

const $=id=>document.getElementById(id);

const money=n=>new Intl.NumberFormat("en-US",{
  style:"currency",
  currency:"USD",
  maximumFractionDigits:0
}).format(Number(n)||0);

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
}[c]));

function badge(status){
  return `<span class="badge ${esc(status.replaceAll(" ",""))}">
    ${esc(status)}</span>`;
}

async function api(url,options={}){
  const response=await fetch(url,{
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers||{})
    }
  });
  const result=await response.json();
  if(!response.ok){
    throw new Error(result.error||"Request failed");
  }
  return result;
}

async function refresh(){
  [invoices,logs,bench,config]=await Promise.all([
    api("/api/invoices"),
    api("/api/audit"),
    api("/api/benchmark"),
    api("/api/config")
  ]);
  render();
}

function stats(){
  return {
    total:invoices.length,
    review:invoices.filter(x=>x.status==="Review Required").length,
    approval:invoices.filter(x=>x.status==="Ready for Approval").length,
    approved:invoices.filter(x=>x.status==="Approved").length,
    outstanding:invoices
      .filter(x=>x.status!=="Approved")
      .reduce((s,x)=>s+Number(x.amount||0),0)
  };
}

function go(name){
  page=name;
  search="";
  filter="All";
  render();
  window.scrollTo(0,0);
}

function navigation(){
  const pending=stats().approval;
  $("nav").innerHTML=NAV.map(name=>`
    <button class="${page===name?"active":""}"
      onclick="go('${name}')">
      ${name}
      ${name==="Approvals"&&pending?
        `<span class="nav-count">${pending}</span>`:""}
    </button>
  `).join("");
}

function head(kicker,title,description,action=""){
  return `<div class="page-head">
    <div>
      <div class="eyebrow">${kicker}</div>
      <h1>${title}</h1>
      <p class="subtext">${description}</p>
    </div>
    ${action}
  </div>`;
}

function metric(label,value,foot,icon){
  return `<div class="metric">
    <span class="metric-icon">${icon}</span>
    <div class="metric-label">${label}</div>
    <div class="metric-value">${value}</div>
    <div class="metric-foot">${foot}</div>
  </div>`;
}

function table(rows){
  return `<div class="table-scroll">

async function upload(input){
  const file=input.files[0];
  if(!file)return;
  const target=$("uploadStatus");
  target.innerHTML='<div class="notice">Processing invoice with AI...</div>';

  try{
    if(file.size>10*1024*1024)throw Error("Maximum 10 MB");

    const base64=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(String(reader.result).split(",")[1]);
      reader.onerror=reject;
      reader.readAsDataURL(file);
    });

    const result=await api("/api/extract",{
      method:"POST",
      body:JSON.stringify({
        name:file.name,
        mime:file.type,
        base64
      })
    });

    await refresh();
    page="Invoices";
    invoiceTab="All";
    render();
    openInvoice(result.invoice.id);
  }catch(error){
    target.innerHTML=`<div class="notice error">${esc(error.message)}</div>`;
  }
}

async function saveInvoice(){
  if(!selected)return;

  const data={};

  [
    "supplier","number","invoiceDate",
    "dueDate","amount","currency"
  ].forEach(key=>{
    data[key]=$("field_"+key).value;
  });

  try{
    const id=selected.id;
    await api("/api/invoices/"+id,{
      method:"PATCH",
      body:JSON.stringify(data)
    });
    await refresh();
    openInvoice(id);
  }catch(error){
    alert(error.message);
  }
}

async function workflow(action){
  if(!selected)return;

    });

function exportData(format){
  const approved=invoices.filter(x=>x.status==="Approved");

  if(!approved.length){
    alert("No approved invoices available.");
    return;
  }

  const fields=[
    "supplier","number","invoiceDate",
    "dueDate","amount","currency"
  ];

  let content,mime;

  if(format==="json"){
    content=JSON.stringify(approved.map(x=>
      Object.fromEntries(fields.map(key=>[key,x[key]]))
    ),null,2);
    mime="application/json";
  }else{
    const quote=v=>'"'+String(v??"").replaceAll('"','""')+'"';
    content=[
      fields.join(","),
      ...approved.map(x=>fields.map(k=>quote(x[k])).join(","))
    ].join("\n");
    mime="text/csv";
  }

  const url=URL.createObjectURL(new Blob([content],{type:mime}));
  const link=document.createElement("a");
  link.href=url;
  link.download="morrow-approved-invoices."+format;
  link.click();
  URL.revokeObjectURL(url);
}

<script>

(function () {
  if (window.__morrowOcrWarningFix) return;
  window.__morrowOcrWarningFix = true;

  function fix() {
    const text = /AI configuration:\s*API key required|Configure OPENAI_API_KEY/i;

    const selects = [...document.querySelectorAll('select')];
    const ocrMode = selects.some(select => {
      const option = select.options[select.selectedIndex];
      return option && /OCR\s*\/\s*PDF text only/i.test(option.textContent);
    });

    if (!ocrMode) return;

    const elements = [...document.querySelectorAll('div, section, aside, p')];

    for (const element of elements) {
      if (!text.test(element.textContent || '')) continue;

      const childrenContainWarning = [...element.children].some(child =>
        text.test(child.textContent || '')
      );

      if (childrenContainWarning) continue;

      let target = element;

      while (
        target.parentElement &&
        target.parentElement !== document.body &&
        target.parentElement.textContent.trim() === target.textContent.trim()
      ) {
        target = target.parentElement;
      }

      target.style.setProperty('display', 'none', 'important');
    }
  }

  document.addEventListener('change', fix, true);

  new MutationObserver(fix).observe(document.documentElement, {
    childList: true,
    subtree: true,
    characterData: true
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fix);
  } else {
    fix();
  }
})();

</script>
